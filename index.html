<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="container">
        <h1>Leftover Labs   <span class="material-symbols-outlined">
            soup_kitchen
            </span></h1>
    
        <h3>Turn Your Leftovers into Culinary Masterpieces !</h3>
       <!-- <p>Make delicious recipes at home by just using leftover food at home ;)</p>-->
        <p>Enter all your leftover ingredients at home (comma-separated):</p>
        <input type="text" id="ingredients" placeholder="e.g., tomato, cheese, basil">
        <button id="findRecipesBtn">Find Recipes</button>

        <div id="recipes"></div>
        <div id="recipe-details"></div>
    </div>
    <style>
        .material-symbols-outlined {
            font-size: 53px;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        </style>
    <script src="script.js"></script>
</body>
</html>
